openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Contract Review API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: contracts
    description: Contract management
  - name: versions
    description: Version control
  - name: comments
    description: Inline comments
  - name: risks
    description: Risk analysis
  - name: templates
    description: Contract templates
  - name: shared
    description: Shared contract access
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /contracts:
    get:
      operationId: listContracts
      tags: [contracts]
      summary: List all contracts with optional search/filter
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
          description: Full-text search on title and parties
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [draft, under_review, approved, rejected]
          description: Filter by status
        - name: riskLevel
          in: query
          required: false
          schema:
            type: string
            enum: [low, medium, high, critical]
          description: Filter by risk level
        - name: expiresWithin
          in: query
          required: false
          schema:
            type: integer
          description: Filter contracts expiring within N days
      responses:
        "200":
          description: List of contracts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Contract"
    post:
      operationId: createContract
      tags: [contracts]
      summary: Create a new contract
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContractInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contract"

  /contracts/stats:
    get:
      operationId: getContractStats
      tags: [contracts]
      summary: Dashboard stats — counts by risk level, recent activity
      responses:
        "200":
          description: Stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractStats"

  /contracts/expiring:
    get:
      operationId: listExpiringContracts
      tags: [contracts]
      summary: List contracts expiring within 30/60/90 days
      parameters:
        - name: days
          in: query
          required: false
          schema:
            type: integer
            default: 30
          description: Number of days to look ahead
      responses:
        "200":
          description: List of expiring contracts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExpiringContract"

  /contracts/templates:
    get:
      operationId: listTemplates
      tags: [templates]
      summary: List available contract templates
      responses:
        "200":
          description: List of templates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ContractTemplate"

  /contracts/upload:
    post:
      operationId: uploadContractFile
      tags: [contracts]
      summary: Upload a PDF or DOCX file and extract its text
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: Extracted text and suggested title
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadResult"
        "400":
          description: Bad request (no file or unsupported type)

  /contracts/send-expiry-alerts:
    post:
      operationId: sendExpiryAlerts
      tags: [contracts]
      summary: Send expiry alert email for contracts expiring soon
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendExpiryAlertsInput"
      responses:
        "200":
          description: Result of alert sending
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendExpiryAlertsResult"

  /contracts/{id}:
    get:
      operationId: getContract
      tags: [contracts]
      summary: Get contract with latest version
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Contract detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractDetail"
        "404":
          description: Not found
    patch:
      operationId: updateContract
      tags: [contracts]
      summary: Update contract metadata
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContractUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contract"
    delete:
      operationId: deleteContract
      tags: [contracts]
      summary: Delete a contract
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /contracts/{id}/share:
    post:
      operationId: shareContract
      tags: [contracts]
      summary: Generate or retrieve a read-only share token for a contract
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Share token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShareResult"

  /contracts/{id}/versions:
    get:
      operationId: listVersions
      tags: [versions]
      summary: List all versions of a contract
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of versions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ContractVersion"
    post:
      operationId: createVersion
      tags: [versions]
      summary: Save a new version (tracked change)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VersionInput"
      responses:
        "201":
          description: Version created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractVersion"

  /contracts/{id}/versions/{versionId}:
    get:
      operationId: getVersion
      tags: [versions]
      summary: Get a specific version
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: versionId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Version detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractVersion"

  /contracts/{id}/comments:
    get:
      operationId: listComments
      tags: [comments]
      summary: List comments on a contract
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of comments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Comment"
    post:
      operationId: createComment
      tags: [comments]
      summary: Add a comment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"

  /contracts/{id}/comments/{commentId}:
    patch:
      operationId: updateComment
      tags: [comments]
      summary: Update a comment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: commentId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
    delete:
      operationId: deleteComment
      tags: [comments]
      summary: Delete a comment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: commentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /contracts/{id}/analyze:
    post:
      operationId: analyzeContract
      tags: [risks]
      summary: Run AI analysis — returns risks and summary
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Analysis result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisResult"

  /contracts/{id}/risks:
    get:
      operationId: listRisks
      tags: [risks]
      summary: Get risk highlights for a contract
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Risk highlights
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RiskHighlight"

  /contracts/{id}/risks/{riskId}:
    patch:
      operationId: updateRisk
      tags: [risks]
      summary: Update negotiation status and counter-proposal for a risk
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: riskId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RiskUpdate"
      responses:
        "200":
          description: Updated risk
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RiskHighlight"

  /contracts/{id}/risks/{riskId}/suggest:
    post:
      operationId: suggestClause
      tags: [risks]
      summary: AI-generate a safer replacement clause for a flagged risk
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: riskId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Suggested replacement clause
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClauseSuggestion"

  /contracts/{id}/summary:
    get:
      operationId: getContractSummary
      tags: [risks]
      summary: Get AI-generated summary of a contract
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Contract summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContractSummary"

  /shared/{token}:
    get:
      operationId: getSharedContract
      tags: [shared]
      summary: Get a contract via read-only share token
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Shared contract detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharedContractDetail"
        "404":
          description: Not found or token invalid

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Contract:
      type: object
      required: [id, title, status, createdAt, updatedAt, versionCount, commentCount, riskCount]
      properties:
        id:
          type: integer
        title:
          type: string
        status:
          type: string
          enum: [draft, under_review, approved, rejected]
        parties:
          type: ["string", "null"]
        effectiveDate:
          type: ["string", "null"]
        expiryDate:
          type: ["string", "null"]
        riskLevel:
          type: ["string", "null"]
          enum: [low, medium, high, critical, null]
        summaryText:
          type: ["string", "null"]
        analyzed:
          type: boolean
        shareToken:
          type: ["string", "null"]
        versionCount:
          type: integer
        commentCount:
          type: integer
        riskCount:
          type: integer
        createdAt:
          type: string
        updatedAt:
          type: string

    ContractDetail:
      type: object
      required: [id, title, status, content, currentVersionId, createdAt, updatedAt]
      properties:
        id:
          type: integer
        title:
          type: string
        status:
          type: string
          enum: [draft, under_review, approved, rejected]
        parties:
          type: ["string", "null"]
        effectiveDate:
          type: ["string", "null"]
        expiryDate:
          type: ["string", "null"]
        riskLevel:
          type: ["string", "null"]
          enum: [low, medium, high, critical, null]
        summaryText:
          type: ["string", "null"]
        analyzed:
          type: boolean
        shareToken:
          type: ["string", "null"]
        content:
          type: string
        currentVersionId:
          type: integer
        createdAt:
          type: string
        updatedAt:
          type: string

    ContractInput:
      type: object
      required: [title, content]
      properties:
        title:
          type: string
          minLength: 1
        content:
          type: string
          minLength: 1
        parties:
          type: string
        effectiveDate:
          type: string
        expiryDate:
          type: string
        status:
          type: string
          enum: [draft, under_review, approved, rejected]

    ContractUpdate:
      type: object
      properties:
        title:
          type: string
        parties:
          type: string
        effectiveDate:
          type: string
        expiryDate:
          type: string
        status:
          type: string
          enum: [draft, under_review, approved, rejected]

    ContractVersion:
      type: object
      required: [id, contractId, versionNumber, content, authorName, changeNote, createdAt]
      properties:
        id:
          type: integer
        contractId:
          type: integer
        versionNumber:
          type: integer
        content:
          type: string
        authorName:
          type: string
        changeNote:
          type: string
        createdAt:
          type: string

    VersionInput:
      type: object
      required: [content, authorName, changeNote]
      properties:
        content:
          type: string
          minLength: 1
        authorName:
          type: string
          minLength: 1
        changeNote:
          type: string
          minLength: 1

    Comment:
      type: object
      required: [id, contractId, authorName, text, resolved, createdAt, updatedAt]
      properties:
        id:
          type: integer
        contractId:
          type: integer
        versionId:
          type: ["integer", "null"]
        authorName:
          type: string
        text:
          type: string
        selectedText:
          type: ["string", "null"]
        resolved:
          type: boolean
        createdAt:
          type: string
        updatedAt:
          type: string

    CommentInput:
      type: object
      required: [authorName, text]
      properties:
        authorName:
          type: string
          minLength: 1
        text:
          type: string
          minLength: 1
        selectedText:
          type: string
        versionId:
          type: integer

    CommentUpdate:
      type: object
      properties:
        text:
          type: string
        resolved:
          type: boolean

    RiskHighlight:
      type: object
      required: [id, contractId, riskLevel, clause, explanation, category, negotiationStatus, createdAt]
      properties:
        id:
          type: integer
        contractId:
          type: integer
        riskLevel:
          type: string
          enum: [low, medium, high, critical]
        clause:
          type: string
        explanation:
          type: string
        category:
          type: string
        negotiationStatus:
          type: string
          enum: [open, accepted, rejected, negotiating]
        suggestion:
          type: ["string", "null"]
        counterProposal:
          type: ["string", "null"]
        createdAt:
          type: string

    RiskUpdate:
      type: object
      properties:
        negotiationStatus:
          type: string
          enum: [open, accepted, rejected, negotiating]
        counterProposal:
          type: string

    ClauseSuggestion:
      type: object
      required: [riskId, suggestion]
      properties:
        riskId:
          type: integer
        suggestion:
          type: string
        rationale:
          type: string

    AnalysisResult:
      type: object
      required: [summary, riskLevel, risks]
      properties:
        summary:
          type: string
        riskLevel:
          type: string
          enum: [low, medium, high, critical]
        risks:
          type: array
          items:
            $ref: "#/components/schemas/RiskHighlight"

    ContractSummary:
      type: object
      required: [contractId, summaryText, riskLevel, analyzed]
      properties:
        contractId:
          type: integer
        summaryText:
          type: ["string", "null"]
        riskLevel:
          type: ["string", "null"]
          enum: [low, medium, high, critical, null]
        analyzed:
          type: boolean

    ContractStats:
      type: object
      required: [total, byStatus, byRiskLevel, recentlyAnalyzed, totalComments, totalVersions, expiringCount]
      properties:
        total:
          type: integer
        byStatus:
          type: object
          additionalProperties:
            type: integer
        byRiskLevel:
          type: object
          additionalProperties:
            type: integer
        recentlyAnalyzed:
          type: integer
        totalComments:
          type: integer
        totalVersions:
          type: integer
        expiringCount:
          type: integer

    ExpiringContract:
      type: object
      required: [id, title, status, expiryDate, daysUntilExpiry]
      properties:
        id:
          type: integer
        title:
          type: string
        status:
          type: string
        parties:
          type: ["string", "null"]
        expiryDate:
          type: string
        daysUntilExpiry:
          type: integer
        riskLevel:
          type: ["string", "null"]

    ContractTemplate:
      type: object
      required: [id, name, description, category, content]
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        category:
          type: string
        content:
          type: string

    ShareResult:
      type: object
      required: [token, url]
      properties:
        token:
          type: string
        url:
          type: string

    UploadResult:
      type: object
      required: [extractedText, suggestedTitle, filename]
      properties:
        extractedText:
          type: string
        suggestedTitle:
          type: string
        filename:
          type: string

    SendExpiryAlertsInput:
      type: object
      required: [to]
      properties:
        to:
          type: string
        days:
          type: integer

    SendExpiryAlertsResult:
      type: object
      required: [sent]
      properties:
        sent:
          type: integer
        to:
          type: string
        message:
          type: string

    SharedContractDetail:
      type: object
      required: [id, title, status, content, parties, effectiveDate, expiryDate, riskLevel, summaryText, risks]
      properties:
        id:
          type: integer
        title:
          type: string
        status:
          type: string
        parties:
          type: ["string", "null"]
        effectiveDate:
          type: ["string", "null"]
        expiryDate:
          type: ["string", "null"]
        riskLevel:
          type: ["string", "null"]
        summaryText:
          type: ["string", "null"]
        content:
          type: string
        risks:
          type: array
          items:
            $ref: "#/components/schemas/RiskHighlight"
