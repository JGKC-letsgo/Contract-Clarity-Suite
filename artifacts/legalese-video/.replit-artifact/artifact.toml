kind = "video"
previewPath = "/legalese-video/"
title = "Contract Clarity — Product Video"
version = "1.0.0"
id = "artifacts/legalese-video"
router = "path"

[[integratedSkills]]
name = "video-js"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/legalese-video/" ]
localPort = 18712

[services.development]
run = "pnpm --filter @workspace/legalese-video run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/legalese-video", "run", "build" ]
publicDir = "artifacts/legalese-video/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18712"
BASE_PATH = "/legalese-video/"
